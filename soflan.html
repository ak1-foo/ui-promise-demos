<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantized Soflan</title>
<link rel="stylesheet" href="common.css">
<style>
  .panes { display: flex; gap: 12px; flex-wrap: wrap; }
  .pane { flex: 1 1 160px; max-width: 320px; }
  .pane h2 { font-size: 14px; margin: 0 0 6px; }
  .pane h2.bad { color: var(--danger); }
  .pane h2.good { color: var(--ok); }
  canvas { display: block; width: 100%; aspect-ratio: 2 / 3; background: #0a0c12; border: 1px solid var(--line); border-radius: 8px; }
  .stat { font-size: 13px; color: var(--muted); margin-top: 4px; min-height: 1.6em; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  #play { width: auto; padding: 0 18px; height: 36px; }
</style>
</head>
<body>
  <h1>量子化ソフラン: ノーツは判定線に重なる瞬間に叩く、という約束</h1>
  <p class="lead">どちらもノーツはカクカク（一定間隔で瞬間移動）しながら流れます。違うのは、「瞬間移動するタイミング」が叩くタイミングに揃っているかどうかだけ。</p>
  <div class="controls">
    <button class="btn primary" id="play">▶ 再生（音が鳴ります）</button>
    <label class="check"><input type="checkbox" id="ghost">本来の位置を重ねる</label>
    <label class="check"><input type="checkbox" id="smooth">量子化を切る（参考）</label>
  </div>
  <div class="panes">
    <div class="pane" data-kind="bad">
      <h2 class="bad">配慮が足りない版</h2>
      <canvas></canvas>
      <div class="stat"></div>
    </div>
    <div class="pane" data-kind="good">
      <h2 class="good">こうしてほしい版</h2>
      <canvas></canvas>
      <div class="stat"></div>
    </div>
  </div>
  <p class="sub">叩いた瞬間（音が鳴る瞬間）に、ノーツが判定線からどれだけ離れて見えていたかを下に出しています。</p>

<script>
  // 譜面: 120BPM、4レーン。量子化の1段 = 1/2拍（250ms）
  const BPM = 120, BEAT = 60 / BPM, LANES = 4;
  const STEP = BEAT / 2;             // 表示が瞬間移動する間隔
  const PX_PER_BEAT = 150;           // 論理座標（高さ600）での流れる速さ
  const H = 600, W = 400, JUDGE_Y = 520;
  const PHASE = { bad: STEP / 2, good: 0 }; // 段の位相。bad は叩くタイミングと半段ずれている
  const LEAD = 2 * BEAT;             // 曲の頭の余白

  // 8分刻みの譜面を作る（2小節パターンを繰り返し）
  const pattern = [0, 2, 1, 3, 0, -1, 2, 1,  3, 1, 2, 0, -1, 3, 1, 2];
  const notes = [];
  for (let bar = 0; bar < 8; bar++) {
    pattern.forEach((lane, i) => {
      if (lane < 0) return;
      notes.push({ t: LEAD + (bar * pattern.length + i) * (BEAT / 2), lane });
    });
  }
  const SONG_END = notes[notes.length - 1].t + 2 * BEAT;

  const panes = [...document.querySelectorAll('.pane')].map(el => {
    const canvas = el.querySelector('canvas');
    return { kind: el.dataset.kind, canvas, ctx: canvas.getContext('2d'), stat: el.querySelector('.stat'), offs: [], flash: new Array(LANES).fill(-1) };
  });

  function fit() {
    const dpr = window.devicePixelRatio || 1;
    panes.forEach(p => {
      const w = p.canvas.clientWidth;
      p.canvas.width = Math.round(w * dpr);
      p.canvas.height = Math.round(w * 1.5 * dpr);
    });
  }
  window.addEventListener('resize', fit);

  const ghostBox = document.getElementById('ghost');
  const smoothBox = document.getElementById('smooth');

  // 表示に使う「時刻」。量子化ソフラン = 表示上の時刻が段々に進む
  function displayTime(now, kind) {
    if (smoothBox.checked) return now;
    const ph = PHASE[kind];
    return Math.floor((now - ph) / STEP) * STEP + ph;
  }
  const yOf = (noteT, shownT) => JUDGE_Y - (noteT - shownT) / BEAT * PX_PER_BEAT;

  let audio, startAt = null, nextSound = 0;
  function now() { return startAt === null ? 0 : audio.currentTime - startAt; }

  function click(when) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 1500;
    g.gain.setValueAtTime(0.25, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.05);
    o.connect(g).connect(audio.destination);
    o.start(when); o.stop(when + 0.06);
  }

  function draw(p, t) {
    const { ctx, canvas } = p;
    const s = canvas.width / W;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const laneW = W / LANES;

    for (let i = 0; i < LANES; i++) {
      ctx.fillStyle = i % 2 ? '#10141d' : '#0d1018';
      ctx.fillRect(i * laneW, 0, laneW, H);
      const age = t - p.flash[i];
      if (p.flash[i] >= 0 && age < 0.15) {
        ctx.fillStyle = `rgba(91,157,255,${0.35 * (1 - age / 0.15)})`;
        ctx.fillRect(i * laneW, 0, laneW, JUDGE_Y + 20);
      }
    }

    const shown = displayTime(t, p.kind);
    for (const n of notes) {
      if (t > n.t + 0.06) continue;          // 叩いたら少しして消える
      const y = yOf(n.t, shown);
      if (y < -20) break;
      const x = n.lane * laneW + 6;
      if (ghostBox.checked) {
        ctx.strokeStyle = 'rgba(255,255,255,.35)';
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(x, yOf(n.t, t) - 9, laneW - 12, 18);
        ctx.setLineDash([]);
      }
      ctx.fillStyle = '#5be3a0';
      ctx.shadowColor = '#5be3a0'; ctx.shadowBlur = 10;
      ctx.fillRect(x, y - 9, laneW - 12, 18);
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = '#ff5d6c';
    ctx.shadowColor = '#ff5d6c'; ctx.shadowBlur = 12;
    ctx.fillRect(0, JUDGE_Y - 2, W, 4);
    ctx.shadowBlur = 0;
  }

  function judgeAt(noteT) {
    panes.forEach(p => {
      const off = Math.round(JUDGE_Y - yOf(noteT, displayTime(noteT, p.kind)));
      p.offs.push(Math.abs(off));
      const avg = p.offs.reduce((a, b) => a + b, 0) / p.offs.length;
      p.stat.textContent = `叩いた瞬間のズレ: ${off === 0 ? '0px（線の上）' : (off > 0 ? '線の手前 ' : '線の奥 ') + Math.abs(off) + 'px'}　平均 ${avg.toFixed(0)}px`;
    });
  }

  let judged = 0;
  function frame() {
    const t = now();
    // 音は少し先まで予約しておく（表示より正確なタイミングで鳴らすため）
    while (startAt !== null && nextSound < notes.length && notes[nextSound].t < t + 0.1) {
      click(startAt + notes[nextSound].t);
      nextSound++;
    }
    while (startAt !== null && judged < notes.length && notes[judged].t <= t) {
      const n = notes[judged++];
      panes.forEach(p => { p.flash[n.lane] = n.t; });
      judgeAt(n.t);
    }
    panes.forEach(p => draw(p, t));
    if (startAt !== null && t > SONG_END) startAt = null;
    requestAnimationFrame(frame);
  }

  document.getElementById('play').addEventListener('click', () => {
    audio = audio || new AudioContext();
    audio.resume();
    startAt = audio.currentTime + 0.1;
    nextSound = 0; judged = 0;
    panes.forEach(p => { p.offs = []; p.flash.fill(-1); p.stat.textContent = ''; });
  });

  fit();
  requestAnimationFrame(frame);
</script>
</body>
</html>
