<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Menu</title>
<link rel="stylesheet" href="common.css">
<style>
  .stage { position: relative; height: 200px; }
  .menu {
    position: absolute; top: 52px; left: 0; width: 240px; z-index: 2;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
    transition: opacity 150ms;
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: block; width: 100%; height: 40px; text-align: left; padding: 0 12px;
    background: transparent; border: 0; border-radius: 6px; color: var(--fg); font: inherit; cursor: pointer;
  }
  .menu button:hover { background: var(--card-2); }
  .menu .danger { color: var(--danger); }
  .menu.closing { opacity: 0; }
  .good .menu.closing { pointer-events: none; }
  .reveal .menu.closing { outline: 2px dashed var(--danger); opacity: .25; }
  #save { position: absolute; top: 136px; left: 0; height: 40px; }
  #open { width: auto; padding: 0 16px; }
</style>
</head>
<body>
  <h1>消えたはずのメニューが、まだそこにある</h1>
  <p class="lead">① メニューを開く → ② 外をクリックして閉じる → ③ すぐに「保存」を押す</p>
  <div class="modes">
    <button class="bad" data-mode="bad">約束を破る版</button>
    <button class="good" data-mode="good">守る版</button>
  </div>
  <label class="check"><input type="checkbox" id="reveal">当たり判定を見せる</label>
  <div class="stage">
    <button class="btn" id="open">⋯ メニュー</button>
    <div class="menu" id="menu" hidden>
      <button data-name="名前を変更">名前を変更</button>
      <button data-name="複製">複製</button>
      <button data-name="全部削除" class="danger">全部削除</button>
    </div>
    <button class="btn primary" id="save">保存</button>
  </div>
  <p class="log" id="log"></p>
  <p class="sub">見た目は150msで消えますが、DOMから外れるのは1.5秒後です（アニメーション終了待ちの実装ミスでよくある形）。</p>

<script src="common.js"></script>
<script>
  const menu = document.getElementById('menu');
  const log = document.getElementById('log');
  let timer;

  function open() {
    clearTimeout(timer);
    menu.classList.remove('closing');
    menu.hidden = false;
  }
  function close() {
    if (menu.hidden || menu.classList.contains('closing')) return;
    menu.classList.add('closing');
    timer = setTimeout(() => { menu.hidden = true; menu.classList.remove('closing'); }, 1500);
  }

  document.getElementById('open').addEventListener('click', e => {
    e.stopPropagation();
    menu.hidden || menu.classList.contains('closing') ? open() : close();
    if (!menu.hidden && !menu.classList.contains('closing')) say(log, '');
  });
  menu.addEventListener('click', e => {
    e.stopPropagation();
    const item = e.target.closest('button');
    if (!item) return;
    const ghost = menu.classList.contains('closing');
    say(log, `「${item.dataset.name}」が実行されました` + (ghost ? '（見えないメニューを押した）' : ''),
        item.dataset.name === '全部削除' ? 'bad' : '');
    close();
  });
  document.getElementById('save').addEventListener('click', e => {
    e.stopPropagation();
    say(log, '保存しました', 'good');
  });
  document.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  document.getElementById('reveal').addEventListener('change', e => document.body.classList.toggle('reveal', e.target.checked));

  setupModes(() => {
    clearTimeout(timer);
    menu.hidden = true;
    menu.classList.remove('closing');
    say(log, '');
  });
</script>
</body>
</html>
